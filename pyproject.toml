[project]
name = "fabscope"
version = "0.2.0"
description = "Use a Micro-Manager-controlled microscope + DMD for maskless microfabrication."
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
    "pymmcore-plus>=0.17.3",
    "useq-schema>=0.7",
    "napari>=0.4.19",
    "napari-micromanager",
    "numpy",
    "scikit-image",
    "matplotlib",
    "tqdm",
    "ipykernel",
    "pyqt6",
]

[tool.uv]
package = false

[tool.uv.sources]
